server:
  port: ${NOTIFICATION_PORT:8082}

spring:
  application:
    name: taskflow-notification-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  branding:
    name: ${APP_NAME:Мунин}
  mail:
    from: ${SMTP_FROM:}
  frontend:
    miniapp-url: ${MINIAPP_URL:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: https://api.telegram.org
  notification:
    # Интервал опроса задаёт точность напоминаний: при часовом опросе
    # напоминание «за час до срока» приходило когда угодно между «за час»
    # и самим сроком, то есть половина уведомлений теряла смысл.
    # Запрос идёт по индексу idx_notif_fire_sent и стоит доли миллисекунды.
    poll-interval-ms: ${NOTIFICATION_POLL_INTERVAL_MS:60000}
    batch-size: 50
    max-retries: 3
