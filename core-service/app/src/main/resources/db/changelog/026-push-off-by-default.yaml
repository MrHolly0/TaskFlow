databaseChangeLog:
  - changeSet:
      id: 026-push-off-by-default
      author: taskflow
      changes:
        - sql:
            sql: "ALTER TABLE user_settings ALTER COLUMN notify_push SET DEFAULT false;"

# Меняется значение DEFAULT для новых строк — существующие не переписываются,
# тем же приёмом, что 023-free-channels-by-default. Но здесь причина другая:
# не стоимость канала, а несовместимая комбинация в самой постановке. "Включён
# по умолчанию" плюс "разрешение браузера спрашиваем только по явному нажатию
# переключателя" вместе дают состояние, которого не бывает: свежий
# пользователь видит переключатель во включённом положении, хотя разрешение
# ещё не запрашивалось и подписки нет — доставить уведомление физически
# нельзя. Начиная с этой правки фактическое положение переключателя на
# фронтенде показывает реальную доставляемость (разрешение выдано и подписка
# жива), а не значение этого поля само по себе — поэтому у существующих строк
# с notify_push=true, оставшихся без подписки, экран и так покажет
# переключатель выключенным.
