databaseChangeLog:
  - changeSet:
      id: 033-task-source-assistant-split
      author: taskflow
      comment: >
        tasks.source не различал подтверждённое пользователем действие
        ассистента и деградацию (реплика не разобралась, задача создана
        без подтверждения) — оба случая писались одним и тем же значением
        по каналу (WEB/BOT_TEXT/BOT_VOICE). Новый код пишет отдельные
        значения ASSISTANT_* и ASSISTANT_*_DEGRADED, старые три остаются
        как есть — ни одна существующая строка не переписывается, различить
        задним числом, каким из двух путей создана старая задача, нельзя.
        Данные не трогаем, только документируем колонку.
      changes:
        - sql:
            sql: >
              COMMENT ON COLUMN tasks.source IS
              'MANUAL — вручную. WEB/BOT_TEXT/BOT_VOICE — исторические
              значения до разделения (миграция 033): и подтверждённое
              действие ассистента, и деградация, по каналу, но неразличимо
              между собой. ASSISTANT_WEB/ASSISTANT_BOT_TEXT/ASSISTANT_BOT_VOICE
              — ассистент, пользователь подтвердил. ASSISTANT_*_DEGRADED —
              ассистент не разобрал реплику, задача создана автоматически.';
