spring:
  application:
    name: taskflow-core
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  # Доверять X-Forwarded-For только от nginx (соединение из приватной сети —
  # у настоящего интернет-клиента такого адреса быть не может), а не любому,
  # кто его пришлёт. native — RemoteIpValve Tomcat со стандартным
  # internal-proxies (loopback + приватные диапазоны, docker-сеть туда
  # попадает); framework (ForwardedHeaderFilter) такой проверки не делает —
  # переписывает адрес по заголовку от кого угодно.
  forward-headers-strategy: native

app:
  branding:
    name: ${APP_NAME:Мунин}
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:dev_secret_key_must_be_at_least_32_characters_long}
    access-token-ttl-seconds: ${JWT_TTL_SECONDS:900}
  qa-login-secret: ${QA_LOGIN_SECRET:}
  geoip:
    database-path: ${GEOIP_DB_PATH:}
  mail:
    from: ${SMTP_FROM:}
  ucaller:
    service-id: ${UCALLER_SERVICE_ID:}
    secret-key: ${UCALLER_SECRET_KEY:}
    callback-secret: ${UCALLER_CALLBACK_SECRET:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    auth-date-max-age: ${TELEGRAM_AUTH_MAX_AGE:86400}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    voice-dir: ${TELEGRAM_VOICE_DIR:/tmp/taskflow/voice}
    miniapp-url: ${PUBLIC_BASE_URL:}
  nlp:
    worker-url: ${NLP_WORKER_URL:http://localhost:8081}
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    tool-call-read-timeout-seconds: 20
  focus:
    hint:
      min-title-words: 4
      estimate-threshold-minutes: 30
    hours-gate:
      window-start-hour: 9
      window-end-hour: 19
      # §5.4: префикс слова ловит падежные формы без морфологии.
      # «банк» убран: падежные формы «банку» и «банке» совпадают у
      # учреждения и ёмкости. Пропуск здесь безопаснее ложного скрытия
      # задачи вне окна 9–19.
      # Вечерние учреждения (кино, спортзал и подобные) сюда намеренно не
      # включены: окно 9–19 для них неверно.
      roots:
        - поликлин
        - больниц
        - аптек
        - магаз
        - мфц
        - нотар
        - автосерв
        - химчист
        - загс
        - соцзащит
        - полиц
        - консульст
        - ветеринар

resilience4j:
  circuitbreaker:
    instances:
      nlp-worker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      nlp-worker-tools:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      nlp-worker:
        max-attempts: 3
        wait-duration: 500ms
      nlp-worker-tools:
        max-attempts: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
