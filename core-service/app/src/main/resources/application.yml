spring:
  application:
    name: taskflow-core
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  branding:
    name: ${APP_NAME:Мунин}
  jwt:
    secret: ${JWT_SECRET:dev_secret_key_must_be_at_least_32_characters_long}
    access-token-ttl-seconds: ${JWT_TTL_SECONDS:900}
  qa-login-secret: ${QA_LOGIN_SECRET:}
  geoip:
    database-path: ${GEOIP_DB_PATH:}
  mail:
    from: ${SMTP_FROM:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    auth-date-max-age: ${TELEGRAM_AUTH_MAX_AGE:86400}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    voice-dir: ${TELEGRAM_VOICE_DIR:/tmp/taskflow/voice}
    miniapp-url: ${MINIAPP_URL:}
  nlp:
    worker-url: ${NLP_WORKER_URL:http://localhost:8081}
    connect-timeout-seconds: 5
    read-timeout-seconds: 30
    tool-call-read-timeout-seconds: 20

resilience4j:
  circuitbreaker:
    instances:
      nlp-worker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      nlp-worker-tools:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      nlp-worker:
        max-attempts: 3
        wait-duration: 500ms
      nlp-worker-tools:
        max-attempts: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: TaskFlow API
    version: 1.0.0
    description: Digital task management assistant powered by AI

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
